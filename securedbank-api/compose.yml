services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=securedbank'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    container_name: 'securedbank'
    ports:
      - '5434:5432'
    volumes:
      - pg-volume:/var/lib/postgresql/data
